<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TouchLCD4 视频烧录器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <span class="brand"><span class="brand-mark" aria-hidden="true"></span>TouchLCD4</span>
      <span class="board-name">Waveshare ESP32-S3-Touch-LCD-4 V4</span>
    </div>
  </header>

  <main class="shell">
    <div class="intro">
      <h1>视频烧录器</h1>
      <p>通过 USB 写入 480 × 480 视频，上传后自动循环播放。</p>
    </div>
    <p id="browserWarning" class="notice" role="status" hidden></p>

    <div class="editor">
      <section class="panel media" aria-labelledby="videoTitle">
        <div class="row media-heading">
          <div>
            <h2 id="videoTitle">素材预览</h2>
            <p id="sourceInfo" class="muted" aria-live="polite">尚未选择视频</p>
          </div>
          <button id="chooseVideoButton" class="button" type="button">选择视频</button>
        </div>
        <input id="videoInput" type="file"
          accept="video/mp4,video/webm,video/quicktime,video/x-msvideo,.avi" hidden>
        <div class="preview-frame">
          <video id="preview" controls playsinline preload="metadata" hidden aria-label="视频预览"></video>
          <img id="aviPreview" hidden alt="MJPEG AVI 首帧预览">
          <label id="emptyPreview" class="empty-preview" for="videoInput">
            <span class="upload-mark" aria-hidden="true"></span>
            <strong>拖入视频</strong>
            <span>或点击选择文件</span>
          </label>
        </div>
        <div class="row media-caption">
          <span>MP4、WebM、MOV、MJPEG AVI</span>
          <span>480 × 480</span>
        </div>
      </section>

      <section class="panel controls" aria-label="设备与播放设置">
        <section class="control-section" aria-labelledby="connectionTitle">
          <h2 id="connectionTitle">连接设备</h2>
          <div class="row device-row">
            <div class="device-copy" aria-live="polite">
              <div class="device-status">
                <span id="connectionDot" class="status-dot" aria-hidden="true"></span>
                <span id="deviceStatus">等待连接设备</span>
              </div>
              <p id="deviceDetails" class="muted">插入开发板后，点击智能连接。</p>
            </div>
            <button id="connectButton" class="button" type="button">智能连接</button>
            <button id="disconnectButton" class="button" type="button" hidden disabled>断开</button>
          </div>
          <details id="portOptions" class="port-options">
            <summary>串口设置</summary>
            <div class="port-fields">
              <label class="field" for="portSelect">已授权串口
                <select id="portSelect"><option value="">智能匹配</option></select>
              </label>
              <div class="actions">
                <button id="scanButton" class="button" type="button">重新检测</button>
                <button id="manualPortButton" class="button" type="button">手动选择</button>
              </div>
              <label class="check"><input id="autoConnectInput" type="checkbox" checked>自动连接已授权设备</label>
              <p id="portHint" class="muted" aria-live="polite"></p>
            </div>
          </details>
        </section>

        <section class="control-section" aria-labelledby="settingsTitle">
          <div class="row section-heading">
            <h2 id="settingsTitle">播放片段</h2>
            <span class="muted">15 fps · 无声</span>
          </div>
          <div class="time-fields">
            <label class="field" for="startInput">起始（秒）
              <input id="startInput" type="number" value="0" min="0" step="0.01" inputmode="decimal">
            </label>
            <label class="field" for="durationInput">时长（秒）
              <input id="durationInput" type="number" value="30" min="0.01" step="0.01" inputmode="decimal">
            </label>
          </div>
          <label class="field quality" for="qualityInput">
            <span class="row">JPEG 画质 <output id="qualityValue" for="qualityInput">70%</output></span>
            <input id="qualityInput" type="range" min="0.4" max="0.95" step="0.05" value="0.7">
          </label>
          <p id="conversionInfo" class="muted" aria-live="polite">默认取前 30 秒，转换预算最高 5 MB。</p>
        </section>

        <section class="control-section upload" aria-label="上传视频">
          <button id="uploadButton" class="button primary" type="button" disabled>上传并播放</button>
          <div class="row progress-label">
            <span id="stageLabel" aria-live="polite">等待选择视频</span>
            <span id="progressLabel">0%</span>
          </div>
          <progress id="progress" max="1" value="0" aria-label="当前操作进度"></progress>
          <p id="errorMessage" class="notice error" role="alert" hidden></p>
          <div class="actions upload-tools">
            <button id="prepareButton" class="link" type="button" disabled>仅转换</button>
            <button id="downloadButton" class="link" type="button" disabled>保存 MJPEG</button>
            <button id="cancelButton" class="link" type="button" hidden disabled>取消</button>
          </div>
        </section>
      </section>
    </div>

    <details class="panel utility">
      <summary>固件与日志</summary>
      <div class="utility-body">
        <div class="row firmware">
          <p id="firmwareHint" class="muted">适用于微雪 V4（16 MB Flash）。安装会清空旧视频。</p>
          <button id="installButton" class="button" type="button" disabled>安装／修复播放器固件</button>
        </div>
        <pre id="log" aria-label="运行日志" tabindex="0">等待操作。</pre>
      </div>
    </details>
    <footer>桌面 Chrome / Edge · 本地转换</footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
